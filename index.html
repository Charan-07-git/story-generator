<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Story Generator</h1>
            <p class="subtitle">Create fun stories with your character, location, and genre</p>
        </header>

        <main>
            <form id="story-form">
                <div class="form-group">
                    <label for="character-name">Character Name</label>
                    <input type="text" id="character-name" placeholder="e.g., Arjun" required>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="e.g., Hyderabad" required>
                </div>

                <div class="form-group">
                    <label for="genre">Genre</label>
                    <select id="genre" required>
                        <option value="" disabled selected>Select a genre</option>
                        <option value="adventure">Adventure</option>
                        <option value="mystery">Mystery</option>
                        <option value="fantasy">Fantasy</option>
                        <option value="sci-fi">Sci-Fi</option>
                        <option value="romance">Romance</option>
                        <option value="horror">Horror</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mood">Mood/Theme</label>
                    <select id="mood">
                        <option value="" disabled selected>Optional</option>
                        <option value="fun">Fun</option>
                        <option value="dramatic">Dramatic</option>
                        <option value="mysterious">Mysterious</option>
                        <option value="epic">Epic</option>
                    </select>
                </div>

                <button type="submit" id="generate-btn" class="btn-primary">Generate Story</button>
            </form>
        </main>

        <div id="story-section" class="story-card hidden">
            <h2>Your Story</h2>
            <p id="story-text"></p>
            <div class="story-meta">
                <span id="story-character"></span>
                <span id="story-location"></span>
                <span id="story-genre"></span>
            </div>
            <div class="actions">
                <button type="button" id="generate-another" class="btn-secondary">Generate Another</button>
                <button type="button" id="copy-story" class="btn-secondary">Copy Story</button>
            </div>
        </div>

        <div id="empty-state" class="empty-state">
            <p>Enter your character name, location, and genre above to generate a story.</p>
        </div>
    </div>
</body>
</html>
